[package]
name = "grotto-mls"
version = "0.1.0"
edition = "2024"

[dependencies]
mls-rs = { version = "0.56", features = ["sqlcipher-bundled"] }
mls-rs-crypto-awslc = "0.25"
mls-rs-provider-sqlite = { version = "0.23" }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
