[workspace]
resolver = "3"

members = [
    "crates/grotto-client",
    "crates/grotto-relay",
    "crates/grotto-protocol",
    "crates/grotto-mls",
]

[workspace.dependencies]
ed25519-dalek = "3"
getrandom = { version = "0.4", features = ["sys_rng"] }
grotto-mls = { path = "crates/grotto-mls" }
grotto-protocol = { path = "crates/grotto-protocol" }
mls-rs = "0.56"
postcard = { version = "1.1.3", features = ["alloc"] }
rcgen = "0.13"
rusqlite = { version = "0.37", features = ["bundled"] }
# Keep TLS crypto independent of the AWS-LC version pinned by MLS.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_arrays = "0.2"
sha2 = "0.10"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
